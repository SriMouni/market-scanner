name: monitor
on:
  schedule:
    - cron: '35 3 * * 1-5'   # 09:05 IST, runs until ~12:20
    - cron: '45 6 * * 1-5'   # 12:15 IST, runs until 15:31
  workflow_dispatch: {}
concurrency:
  group: scanner-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monitor (30-s exits, opening-range signals)
        env:
          TZ: Asia/Kolkata
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: timeout 11700 python app.py monitor || true   # stop after 3h15m; next half takes over
      - name: Save state
        if: always()
        run: |
          python app.py dashboard
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "monitor $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs && git push
