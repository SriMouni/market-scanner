name: monitor
on:
  schedule:
    - cron: '35 3 * * 1-5'   # 09:05 IST, runs until ~12:20
    - cron: '45 6 * * 1-5'   # 12:15 IST, runs until 15:31
  workflow_dispatch: {}
concurrency:
  group: monitor
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monitor (30-s exits, 1-min signals) + 5-min stock scans, saving every 5 min
        env:
          TZ: Asia/Kolkata
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          save() {
            python app.py dashboard >/dev/null 2>&1 || true
            git add data docs
            git diff --cached --quiet && return 0
            git commit -q -m "monitor $(date +'%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do git pull -q --rebase --autostash -X theirs && git push -q && return 0; sleep $((RANDOM % 10 + 5)); done
          }
          timeout 11700 python app.py monitor &   # 3h15m; the next scheduled half takes over
          PID=$!
          # every 5 min: stock scanner + NIFTY market mood, then save to the website
          while kill -0 $PID 2>/dev/null; do
            sleep 300
            python -W ignore app.py intraday || true
            save
          done
          save
