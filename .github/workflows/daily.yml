name: daily
on:
  schedule:
    - cron: '30 13 * * 1-5'   # 19:00 IST, after NSE publishes daily files
    - cron: '30 14 * * 1-5'   # backups (GitHub schedules can be late or skipped);
    - cron: '30 16 * * 1-5'   # a run that finds the day already done exits without messaging
    - cron: '30 1 * * 2-6'    # 07:00 IST next morning, last chance before the open
  workflow_dispatch: {}
concurrency:
  group: daily
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily
        env:
          TZ: Asia/Kolkata
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python app.py daily
      - name: Save results
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "daily update $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash -X theirs && git push -q && break; sleep $((RANDOM % 10 + 5)); done
